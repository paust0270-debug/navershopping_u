<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
  <title>네이버 트래픽 자동화</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 로그인 오버레이 -->
  <div id="loginOverlay" class="login-overlay" style="display:none">
    <div class="login-box">
      <h2>네이버 트래픽 자동화</h2>
      <p class="login-sub">인증된 사용자만 이용 가능합니다</p>
      <input type="email" id="loginEmail" placeholder="이메일" autocomplete="email" />
      <input type="password" id="loginPassword" placeholder="비밀번호" autocomplete="current-password" />
      <button type="button" id="btnLogin" class="login-btn">로그인</button>
      <p id="loginError" class="login-error"></p>
    </div>
  </div>

  <div class="app">
    <div class="toolbar">
      <button type="button" class="primary" id="btnStart">▶ 시작</button>
      <button type="button" class="danger" id="btnStop">■ 중지</button>
      <button type="button" class="secondary" id="btnSaveConfig" title="작업 목록과 설정을 함께 저장">저장</button>
      <button type="button" class="secondary" id="btnSaveResults" title="현재 표를 보고용 파일로 내보내기">결과 내보내기</button>
      <button type="button" class="secondary" id="btnResetStats">초기화</button>
      <span class="status" id="runnerStatus">대기 중</span>
    </div>

    <div class="ad-banner" aria-label="광고 배너">
      <div class="ad-badge">AD</div>
      <div class="ad-copy">
        <strong>광고 배너 영역</strong>
        <span>파트너 공지나 프로모션 이미지를 이 위치에 노출할 수 있습니다.</span>
      </div>
      <button type="button" class="ad-action" id="btnAdBanner">자세히</button>
    </div>

    <div class="main-flex">
      <div class="row-top">
        <div class="panel task-panel">
          <h3>작업 키워드</h3>
          <div class="body">
            <table class="data" id="taskTable">
              <colgroup id="taskColumnGroup">
                <col data-col-key="check" />
                <col data-col-key="rownum" />
                <col data-col-key="keyword" />
                <col data-col-key="url" />
                <col data-col-key="secondKeyword" />
                <col data-col-key="mid" />
                <col data-col-key="productTitle" />
                <col data-col-key="targetCount" />
                <col data-col-key="remaining" />
                <col data-col-key="success" />
                <col data-col-key="fail" />
                <col data-col-key="rank" />
                <col data-col-key="review" />
                <col data-col-key="rating" />
              </colgroup>
              <thead>
                <tr>
                  <th><input type="checkbox" id="checkAll" title="전체 선택" /></th>
                  <th class="col-rownum">#</th>
                  <th>검색 키워드</th>
                  <th>상품 URL</th>
                  <th id="thSecondKeyword" title="2차 검색 조합에 사용할 추가 키워드">2차 키워드 (선택)</th>
                  <th title="URL에서 자동 추출">MID</th>
                  <th title="순위체크 시 자동 수집">상품명</th>
                  <th title="시작 시점에 로드할 실행 횟수 (0=무제한)">횟수</th>
                  <th title="시작 시점 기준 남은 실행 횟수">남은</th>
                  <th title="오늘 성공 횟수">성공</th>
                  <th title="오늘 실패 횟수">실패</th>
                  <th title="D순위체크 결과">순위</th>
                  <th title="리뷰 수">리뷰</th>
                  <th title="별점">별점</th>
                </tr>
              </thead>
              <tbody id="taskBody"></tbody>
            </table>
            <div class="row-tools">
              <button type="button" id="btnAddRow">행 추가</button>
              <button type="button" id="btnDelRow">선택 행 삭제</button>
              <button type="button" class="danger-inline" id="btnClearAllRows">전체 삭제</button>
            </div>
          </div>
        </div>
        <div class="config-row">
          <div class="panel config-panel delay-panel">
            <div class="panel-title-row">
              <h3>작업 딜레이 (ms)</h3>
            </div>
            <div class="body delay-body">
              <div class="delay-grid delay-grid--head">
                <label>작업 선택</label>
                <select id="searchFlowVersion" class="mode mode-span" style="grid-column:2/4">
                  <option value="A">A — 조합검색 (1차+2차 키워드)</option>
                  <option value="B">B — 메인키워드만 검색</option>
                  <option value="C">C — 2차키워드만 (제목풀, 필수입력)</option>
                  <option value="D">D — 쇼핑 순위체크만 (트래픽 없음)</option>
                  <option value="E">E — ackey 위장 URL (자동완성 위장)</option>
                  <option value="F">F — 제목 풀 검색 (상품명 단어 조합)</option>
                </select>
              </div>
              <div class="delay-grid" id="delayGrid"></div>
              <div class="delay-grid">
                <label title="트래픽: 목록 스크롤 / D순위: 쇼핑 최대 페이지">최대 스크롤</label>
                <input type="number" id="maxScroll" class="delay-num-tight" min="1" value="4" style="grid-column:2/4" title="D모드에서는 쇼핑 검색 최대 페이지 수" />
              </div>
              <div class="delay-grid delay-grid--head">
                <label>워크 모드</label>
                <select id="workMode" class="mode mode-span" style="grid-column:2/4">
                  <option value="mobile">Mobile</option>
                  <option value="desktop">Desktop</option>
                  <option value="random">PC+Mobile 랜덤</option>
                </select>
              </div>
              <div class="naver-login-grid" style="margin-top:6px">
                <div class="checkbox-row">
                  <input type="checkbox" id="naverLoginEnabled" />
                  <label for="naverLoginEnabled">네이버 로그인 사용</label>
                </div>
                <label>로그인 방식</label>
                <select id="naverLoginMode" class="mode">
                  <option value="gui">GUI 입력 자동 로그인</option>
                  <option value="manual">브라우저에서 직접 입력</option>
                  <option value="auto">naver-account.txt 자동 입력</option>
                </select>
                <label>네이버 ID</label>
                <input type="text" id="naverLoginId" autocomplete="off" />
                <label>네이버 PW</label>
                <input type="password" id="naverLoginPw" autocomplete="off" />
              </div>
            </div>
          </div>
          <div class="panel config-panel ua-panel">
            <h3>User-Agent</h3>
            <div class="body ua-body">
              <label class="ua-label">Desktop (줄당 1개)</label>
              <textarea class="block compact-textarea" rows="2" id="uaDesktop" placeholder="비워두면 기본 UA 자동 사용 (Chrome/131)"></textarea>
              <label class="ua-label">Mobile</label>
              <textarea class="block compact-textarea" rows="2" id="uaMobile" placeholder="비워두면 기본 UA 자동 사용 (Galaxy S23 Chrome/144)"></textarea>
            </div>
          </div>
          <div class="panel config-panel proxy-panel">
            <div class="panel-title-row">
              <h3>IP 로테이션</h3>
            </div>
            <div class="body proxy-body">
              <div class="checkbox-row">
                <input type="checkbox" id="toggleUsbDataBeforeTask" />
                <label for="toggleUsbDataBeforeTask">작업 전 USB 데이터 OFF→ON 실행 (USB 폰 연결 시)</label>
              </div>
              <div style="margin-top:10px">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
                  <label title="CAPTCHA 자동 해결에 사용 (E/F 플로우 등)" style="font-size:12px;color:#ccc">Anthropic API 키</label>
                  <button type="button" id="btnAddApiKey" style="font-size:11px;padding:2px 8px">+ 키 추가</button>
                </div>
                <div id="apiKeyList" style="display:flex;flex-direction:column;gap:4px"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel log-wrap">
        <h3>로그</h3>
        <div class="body">
          <textarea class="block log-area" id="logArea" readonly></textarea>
        </div>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
